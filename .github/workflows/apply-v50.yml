name: Apply v50 patch

on:
  push:
    paths:
      - 'patches/v50.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and verify
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, subprocess, traceback

          def build():
              spec = json.load(open('patches/v50.json', encoding='utf-8'))
              src = open('index.html', encoding='utf-8').read()
              trailing = src.endswith('\n')
              if trailing:
                  src = src[:-1]
              lines = src.split('\n')
              assert len(lines) == 18923, 'base line count %d' % len(lines)
              for o in sorted(spec, key=lambda x: x['line'], reverse=True):
                  i = o['line'] - 1
                  assert i < len(lines), 'line out of range %d' % o['line']
                  assert lines[i] == o['verify'], 'verify fail @%d: %r' % (o['line'], lines[i][:70])
                  if o['op'] == 'insertAfter':
                      lines[i + 1:i + 1] = o['lines']
                  elif o['op'] == 'insertBefore':
                      lines[i:i] = o['lines']
                  elif o['op'] == 'replaceLines':
                      n = o['count']
                      assert lines[i:i + n] == o['expect'], 'expect mismatch @%d' % o['line']
                      lines[i:i + n] = o['lines']
                  else:
                      raise AssertionError('op ' + o['op'])
              assert len(lines) == 19230, 'final line count %d' % len(lines)
              out = '\n'.join(lines) + ('\n' if trailing else '')
              assert out.count('v50') == 10, 'v50 marker count %d' % out.count('v50')
              for m in ['healthCalJump', 'jumpHealthCalendar', 'renderHealthCalendar', 'selectHealthCalendarDay', "media_workflow_pomodoro', // v50", "media_workflow_dark_mode', // v50", 'POMODORO_FOCUS_SECONDS / 3600', 'health.history.length > 365']:
                  assert m in out, 'missing ' + m
              blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', out, re.S)
              for bi, b in enumerate(blocks):
                  p = 'chk_%d.js' % bi
                  with open(p, 'w', encoding='utf-8') as f:
                      f.write(b)
                  r = subprocess.run(['node', '--check', p], capture_output=True, text=True)
                  os.remove(p)
                  assert r.returncode == 0, 'js syntax err block %d: %s' % (bi, r.stderr[:500])
              print('script blocks checked:', len(blocks))
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(out)
              shutil.rmtree('patches')
              os.remove('.github/workflows/apply-v50.yml')
              if os.path.exists('apply-error.txt'):
                  os.remove('apply-error.txt')
              print('patch applied')

          try:
              build()
          except Exception:
              with open('apply-error.txt', 'w', encoding='utf-8') as f:
                  f.write(traceback.format_exc())
              print('FAILED')
          PY
      - name: Commit and push
        run: |
          git config user.name "qingqiu-bot"
          git config user.email "qingqiu-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "v50: 番茄钟与主题云同步 + 健康日历 + 番茄专注自动累加"
          git push origin HEAD:main
