name: Update Daily News

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00（TRAE 任务 08:30 更新 Supabase 后半小时拉取）
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest news from Supabase
        env:
          SUPABASE_URL: https://jeenckvarydrdpdlqvdd.supabase.co/rest/v1
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZW5ja3ZhcnlkcmRwZGxxdmRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5ODg3NTQsImV4cCI6MjEwMTU2NDc1NH0.HjLXEf6BE_fsLpGzJ79lRcxudfEc3BI48IcCSOyOwqA
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os, sys

          # ⚠️ 只抽 media_workflow_news 字段，绝不拉整行 data
          # 整行 data 包含 tasks/accounts/health 等用户所有数据，会把它们写进 news-data.json → 提交回 GitHub
          url = os.environ["SUPABASE_URL"] + "/workbench_sync?user_id=eq.default&select=data%3Emedia_workflow_news"
          req = urllib.request.Request(url, headers={
              "apikey": os.environ["SUPABASE_KEY"],
              "Authorization": "Bearer " + os.environ["SUPABASE_KEY"],
          })
          with urllib.request.urlopen(req) as resp:
              rows = json.loads(resp.read())

          if not rows:
              print("无云端数据，退出")
              sys.exit(0)

          cloud = rows[0].get("data") or {}
          news_raw = cloud.get("media_workflow_news", "[]")
          news = json.loads(news_raw) if isinstance(news_raw, str) else (news_raw or [])

          if not news:
              print("云端无快讯数据，退出")
              sys.exit(0)

          news.sort(key=lambda x: x.get("date", ""), reverse=True)

          with open("news-data.json", "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)

          print(f"写入 {len(news)} 条快讯")
          for n in news[:5]:
              print(f"  {n.get('date')} {n.get('title','')[:40]}")
          PYEOF

      - name: Verify output is news-only
        run: |
          if [ -f news-data.json ]; then
            bad=$(python3 -c "
              import json, sys
              try:
                arr = json.load(open('news-data.json'))
                if not isinstance(arr, list): print('not-array'); sys.exit(1)
                # 检查有没有混入 tasks 类字段
                has_task = any('platform' in x and ('title' in x or 'dueDate' in x) for x in arr[:3])
                print('has-task-fields=' + str(has_task))
              except Exception as e:
                print('parse-error: ' + str(e))
            ")
            echo "$bad"
            if echo "$bad" | grep -qi "has-task-fields=True\|not-array\|parse-error"; then
              echo "❌ news-data.json 校验失败，拒绝提交！"
              git checkout HEAD -- news-data.json 2>/dev/null || true
              exit 1
            fi
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "auto: daily news $(date -u +%Y-%m-%d)"
            git push
          fi
