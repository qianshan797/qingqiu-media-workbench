<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新媒体运营工作台</title>
    <meta http-equiv="refresh" content="0; url=media-workflow-tool.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F2F2F7;
            color: #1C1C1E;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #E5E5EA;
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
        .sub { font-size: 13px; color: #8E8E93; margin-bottom: 24px; }
        a.btn {
            display: inline-block;
            padding: 10px 20px;
            background: #007AFF;
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <div class="title">正在打开工作台...</div>
        <div class="sub">如果没有自动跳转，请点击下方按钮</div>
        <a class="btn" href="media-workflow-tool.html">打开工作台</a>
    </div>
</body>
</html>
